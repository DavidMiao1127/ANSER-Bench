<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2400" height="600" viewBox="0 0 2400 600" role="img" aria-labelledby="title desc">
  <title id="title">ANSER-Bench</title>
  <desc id="desc">A Comprehensive Benchmark for Analytical Search. A stylized magnifying glass with an ascending analytical bar chart linked to three evidence nodes, followed by the ANSER-Bench wordmark.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152C"/>
      <stop offset="0.51" stop-color="#091933"/>
      <stop offset="1" stop-color="#0D2041"/>
    </linearGradient>
    <radialGradient id="bgGlow" gradientUnits="userSpaceOnUse" cx="1150" cy="330" r="1350">
      <stop offset="0" stop-color="#142846" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#10223C" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#071529" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aquaBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#69FFEA"/>
      <stop offset="0.4" stop-color="#31D9EE"/>
      <stop offset="1" stop-color="#438CFC"/>
    </linearGradient>
    <linearGradient id="textAqua" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#50F0D9"/>
      <stop offset="1" stop-color="#42D8E2"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D1E1F7"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AFFF0"/>
      <stop offset="0.65" stop-color="#2ED2F0"/>
      <stop offset="1" stop-color="#438CFC"/>
    </linearGradient>
    <clipPath id="clip"><rect x="0" y="0" width="2400" height="600" rx="104"/></clipPath>
  </defs>

  <!-- Evenly rounded on both sides; no right-side decorations -->
  <g clip-path="url(#clip)">
    <rect width="2400" height="600" fill="url(#bg)"/>
    <rect width="2400" height="600" fill="url(#bgGlow)"/>
  </g>

  <!-- Connected evidence nodes -->
  <g fill="none" stroke="url(#aquaBlue)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M319 232 L274 192" stroke-width="15"/>
    <path d="M316 376 L272 418" stroke-width="15"/>
    <path d="M499 302 H551" stroke-width="15"/>
  </g>
  <g fill="#0A1B36" stroke="url(#nodeGrad)" stroke-width="13">
    <rect x="192" y="123" width="83" height="83" rx="23"/>
    <rect x="190" y="408" width="83" height="83" rx="23"/>
    <rect x="550" y="260" width="83" height="83" rx="23"/>
  </g>

  <!-- Search lens and analytical signal -->
  <path d="M454 376 L512 437" fill="none" stroke="url(#aquaBlue)" stroke-width="34" stroke-linecap="round"/>
  <circle cx="397" cy="298" r="100" fill="#0A1C37" stroke="url(#aquaBlue)" stroke-width="27"/>
  <g fill="url(#bars)">
    <rect x="351" y="313" width="21" height="45" rx="6"/>
    <rect x="387" y="289" width="21" height="69" rx="6"/>
    <rect x="423" y="263" width="21" height="95" rx="6"/>
  </g>

  <!-- Main wordmark (text stays editable) -->
  <text x="690" y="348" font-family="Inter, Arial, Helvetica, sans-serif" font-size="177" font-weight="800"
        letter-spacing="-4.5" fill="#F9FBFF">ANSER<tspan fill="url(#textAqua)">-Bench</tspan></text>
  <text x="693" y="428" font-family="Inter, Arial, Helvetica, sans-serif" font-size="51" font-weight="400"
        letter-spacing="0" fill="#C1D2EB">A Comprehensive Benchmark for Analytical Search</text>
</svg>
